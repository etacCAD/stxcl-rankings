name: Update rankings

on:
  schedule:
    - cron: "0 13 * * 1"   # Mondays 13:00 UTC = 8 AM CDT / 7 AM CST, after weekend results post
  workflow_dispatch:       # manual "Run workflow" button

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Refresh GotSport tournament games (slow; falls back to saved data if blocked)
        run: python gotsport.py
        continue-on-error: true
        timeout-minutes: 20

      - run: python build_site.py

      - name: Commit snapshot and GotSport cache
        run: |
          git config user.name "rankings-bot"
          git config user.email "rankings-bot@users.noreply.github.com"
          git add history gotsport
          git diff --cached --quiet || (git commit -m "Weekly data $(date -u +%F)" && git push)

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
